name: 유튜브 쇼츠 영상 만들기

on:
  schedule:
    # 매일 한국시간 아침 7시 43분 (UTC 22:43). 시간을 바꾸려면 이 줄을 수정하세요.
    - cron: "43 22 * * *"
  workflow_dispatch:
    inputs:
      keyword:
        description: "키워드 (비우면 순서대로 자동)"
        required: false
      demo:
        description: "샘플 상품으로 테스트만 (기록 안 남김)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
      COUPANG_SUB_ID: ${{ vars.COUPANG_SUB_ID }}
      LINK_PAGE_TITLE: ${{ vars.LINK_PAGE_TITLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한글 폰트, ffmpeg 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk ffmpeg
      - run: pip install -r requirements.txt

      - name: 영상 만들기
        env:
          KEYWORD: ${{ inputs.keyword }}
          DEMO: ${{ inputs.demo }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          export LINK_PAGE_URL="${{ vars.LINK_PAGE_URL }}"
          [ -n "$LINK_PAGE_URL" ] || LINK_PAGE_URL="https://${OWNER,,}.github.io/${REPO}/"
          MUSIC=(); [ -f music.mp3 ] && MUSIC=(--music music.mp3)
          if [ "$DEMO" = "true" ]; then MODE=(--demo); else MODE=(--record); fi
          python make_shorts.py ${KEYWORD:+"$KEYWORD"} "${MODE[@]}" "${MUSIC[@]}"

      - name: 다운로드 페이지(Release) 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="shorts-$(date +%Y%m%d-%H%M)"
          [ "${{ inputs.demo }}" = "true" ] && TAG="sample-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" output/shorts.mp4 \
            --title "$(date +%m월%d일) · $(cat output/title.txt)" \
            --notes-file output/release.md

      - name: 링크 페이지 / 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/posts.json
          git diff --cached --quiet || { git commit -m "쇼츠 기록 업데이트"; git push; }
